<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gra</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</head>
<body>

    <div class="left-side">
        <div id="game-screen">
            <div class="stats">
                <h2>Gra Wyzej Nizej</h2>
                </div>
               <div class="board" id="board">

    <label for="wybor">Wybierz kolor karty:</label>

    <select id="wybor">
        <option value="czerwony">Czerwony</option>
        <option value="czarny">Czarny</option>
    </select>
</div>
            </div>
    </div>
                <div id="start-screen" class="start-screen">
                <h2>Nowa Gra</h2>
                <form id="start-form">
                    <input type="text" id="player-name" placeholder="Wpisz imię (min. 3 znaki)" maxlength="15">
                    <p id="error-msg" class="error">Imię musi mieć minimum 3 znaki!</p>
                    <button type="submit">Rozpocznij grę</button>
                </form>
                
            </div>
    <div class="right-panel" >
            <div class="taliakart">
                    <h2>taliakart</h2>
                    <img src="../img/backcard.png" alt="Talia kart">
                </div>
        
      

        <div class=" container2 hidden-panel">
            <h2>Statystki</h2>
            <div class="player">
                    <span>Gracz: <strong id="display-name"></strong></span>
                    <br>
                    <span>Punkty: <strong>0</strong></span>
                    <br>
                    <span>Etap: <strong>0</strong></span>
                    <br>
                    <span>Wygrane: <strong>0</strong></span>
                    <br>
                    <span>Przegrane <strong>0</strong></span>
                    <br>
                </div>
        </div>

    </div>
    <script>
        $('.hidden-panel').hide();
          $('.right-panel').hide();
    </script>

</body>
</html>
